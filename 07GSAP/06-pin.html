<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Pin</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
  <script defer src="./06-pin.js"></script>
  <link rel="stylesheet" href="./06-pin.css">
</head>

<body>
  <header style="background-color: orange; top: 0; padding-block: 20px; z-index: 100">
    HEADER
  </header>
    <!-- 
      header 고정을 하려면 header 요소가 smooth-wrapper 요소 바깥에 있어야 충돌이 나지 않는다.
    -->
  <div id="smooth-wrapper">
    <div id="smooth-content">
      <section class="section1" style="--color:10;">
        <strong>1</strong>
      </section>
      <div class="box">Box Element</div>
      <section class="section2" style="--color:50;">
        <strong>2</strong>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Excepturi obcaecati corporis mollitia iste doloremque
        numquam rerum ut, sequi autem eius ipsum a exercitationem earum voluptas voluptates neque ad, at dicta.
      </section>
      <div class="block"></div>
      <section class="section section3" style="--color:90;">
        <strong class="fix">Fix Text</strong>
      </section>
      <section class="section4" style="--color:150;">
        <strong>Rebehayan</strong>
      </section>
      <section class="section5" style="--color:200;">
        <strong>5</strong>
      </section>
    </div>
  </div>
</body>

</html>
